name: SDK contract
on:
  push:
    paths: ['sdk/**', '.github/workflows/sdk-check.yml']
  pull_request:
    paths: ['sdk/**', '.github/workflows/sdk-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run example
